name: CardioCare Continuous Integration Pipeline

# 트리거 시점: main 및 dev 브랜치로의 코드 변경 발생 시 즉시 구동
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-24.04 # 로컬 개발 환경: Ubuntu LTS 버전 컨텍스트 부합

    steps:
    # 1. 소스 코드 체크아웃
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. 런타임 가상환경 셋업
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip' # pip 의존성 캐싱으로 CI 빌드 속도 단축

    # 3. 고정 버전 종속성 패키지 및 린터 설치
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff # 초고속 Rust 기반 린터/포매터 추가 설치

    # 4. Ruff를 이용한 소스 코드 스타일 정적 분석 및 포맷팅 검증 (Fast-Fail 적용)
    # PEP 8 스타일 위반 및 미사용 임포트, 포맷팅 미준수 발견 시 이후 테스트를 실행하지 않고 즉시 종료
    - name: Lint and Format Check with Ruff
      run: |
        ruff check .
        ruff format --check .

    # 5. 자동화 유닛 테스트 타겟 구동
    - name: Execute Automated Unit Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py"